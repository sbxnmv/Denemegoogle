<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14130f">
<title>Kelime Öğren</title>
<style>
:root{--bg:#14130f;--card:#1e1d18;--bd:#35332a;--tx:#f1eee4;--mu:#9a9686;--ac:#e0b44c;--gr:#4cc38a;--rd:#ee6055;--or:#f0a23b;--der:#6cb2ff;--die:#ff7b7b;--das:#5fd35f;--fs:16px}
[data-theme=light]{--bg:#f3f1ea;--card:#fffdf8;--bd:#dcd8c8;--tx:#23211a;--mu:#6f6b5c;--ac:#9a6b00;--gr:#23915f;--rd:#c8372d;--or:#c97a00;--der:#1565c0;--die:#d32f2f;--das:#2e7d32}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:.5rem .8rem}
button:active{transform:scale(.97)}button:disabled{opacity:.45}
.wrap{max-width:560px;margin:0 auto;padding:.7rem .9rem 2rem}
.bar{display:flex;gap:.5rem;align-items:center}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:none;padding:.45rem .8rem;color:var(--mu);font-weight:600}
.seg button.on{background:var(--ac);color:#14130f}
select{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.5rem}
.stats{font-size:.72rem;color:var(--mu);margin:.6rem 0;text-align:center;line-height:1.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:1.2rem 1rem;text-align:center}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--mu);gap:.5rem}
.word{font-family:Georgia,serif;font-size:2.4rem;font-weight:700;margin:1rem 0 .6rem;line-height:1.15;word-break:break-word;cursor:pointer}
.tools{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap}
.tools button{width:2.8rem;height:2.8rem;border-radius:50%;padding:0;font-size:1.15rem}
.art{display:none;gap:.5rem;justify-content:center;margin-top:.9rem}.art.on{display:flex}
.art button{flex:1;max-width:6.5rem;color:#fff;font-weight:700;font-size:1.1rem;border:0;padding:.7rem}
.verdict{min-height:1.4rem;font-weight:700;margin-top:.5rem;font-size:.9rem}
.mean{font-size:1.25rem;margin:1rem 0 .6rem}.mean.blur{filter:blur(7px);cursor:pointer}
.ex{font-size:1rem;line-height:1.6;margin-top:.4rem}
.ex .k{color:var(--gr);font-weight:700}.ex .c{color:var(--der);text-decoration:underline dotted;cursor:pointer}
.tr{font-size:.82rem;color:var(--mu);margin-top:.3rem;min-height:1rem}
.spk{font-size:.8rem;margin-top:.5rem;min-height:1rem;color:var(--mu)}
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.8rem}
.ans button{border:0;color:#fff;font-weight:700;padding:.9rem .2rem;font-size:.9rem}
.g{background:var(--gr)}.o{background:var(--or)}.r{background:var(--rd)}
.skip{display:block;margin:.7rem auto 0;color:var(--mu);background:none}
.hint{font-size:.7rem;color:var(--mu);text-align:center;margin-top:.8rem}
.empty{padding:2.5rem 1rem;color:var(--mu)}
.mini{font-size:.8rem;color:var(--mu);line-height:1.5}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:85dvh;overflow-y:auto;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom))}
.sheet h3{margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center}
.sheet label{display:block;font-size:.8rem;color:var(--mu);margin:.7rem 0 .25rem}
.sheet input:not([type=checkbox]):not([type=file]),.sheet select{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.6rem}
.row{display:flex;gap:.5rem;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.save{background:var(--ac);color:#14130f;border:0;font-weight:700;width:100%;margin-top:.8rem;padding:.75rem}
.sec{background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
.opt{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--bd)}
.dict .pos{color:var(--ac);font-size:.75rem;margin:.8rem 0 .2rem;font-weight:700}
.dict .d{margin-bottom:.2rem;line-height:1.5}.dict .e{color:var(--mu);font-style:italic;font-size:.85rem;padding-left:.6rem;border-left:2px solid var(--bd);margin-bottom:.4rem}
.li{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--bd)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);padding:.6rem 1rem;border-radius:10px;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:90vw}
.toast.on{opacity:1}
.del{cursor:pointer;opacity:.7;padding:0 .4rem}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:.8rem;align-items:center;justify-content:center;z-index:100}
#lock input{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.7rem;text-align:center;letter-spacing:.3rem;width:10rem}
#lock .save{width:10rem;margin:0}
#pl{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom));z-index:40;display:flex;gap:.5rem;align-items:center}
#pl .t{flex:1;min-width:0}#pl .t b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pl .t span{font-size:.8rem;color:var(--mu)}
#pl button{width:2.6rem;height:2.6rem;padding:0;border-radius:50%;flex:none}
</style>
</head>
<body>
<div id="lock" style="display:none"><h2>Kelime Öğren</h2><input type="password" id="pw" placeholder="Şifre" onkeydown="if(event.key==='Enter')unlock()"><button class="save" onclick="unlock()">Giriş</button><div id="pwe" style="color:var(--rd);font-size:.8rem"></div></div>
<div class="wrap">
  <div class="bar">
    <div class="seg" id="langSeg"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="de" onclick="setLang('de')">DE</button></div>
    <select id="filter" onchange="setFilter(this.value)"></select>
    <button onclick="openAdd()" aria-label="Kelime ekle">➕</button>
    <button onclick="openSettings()" aria-label="Ayarlar">⚙️</button>
  </div>
  <div class="stats" id="stats">Firebase'e bağlanıyor…</div>
  <div id="main"><div class="card empty">Yükleniyor…</div></div>
  <div class="hint">Klavye: ← biliyorum · ↑ orta · → bilmiyorum · ↓ sesi tekrar · 1/2/3 artikel · M grup</div>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const PASS='654881', ORTA_UST=5, BILMIREM_ESK=2, ESIK_ORTA=250, ESIK_YUKSEK=150;
const CARPAN={yuksek:[1,1,1],orta:[1.8,1,.5],az:[3,1.5,.3]};
const LANGS={en:{col:'sozler',tts:'en-US',ad:'İngilizce'},de:{col:'sozler_de',tts:'de-DE',ad:'Almanca'}};
const SRS={BILMIYORUM_SN:600,ORTA_MIN_GUN:.1,CARPAN:2.2,MAX_GUN:180};
const db=getFirestore(initializeApp({
  apiKey:"AIzaSyCo8L-ziEftkkDz8tDm0X0nKdUME4bKQNM",authDomain:"sozler-fc7c0.firebaseapp.com",
  projectId:"sozler-fc7c0",storageBucket:"sozler-fc7c0.firebasestorage.app",
  messagingSenderId:"234991221431",appId:"1:234991221431:web:da04cfca423a00704cab32"}));

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const st=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const today=()=>new Date().toISOString().slice(0,10);
/* anahtar için ikinci depo (IndexedDB): localStorage silinse bile anahtar kaybolmaz */
const idb=(()=>{try{
  const o=indexedDB.open('kv',1);o.onupgradeneeded=()=>o.result.createObjectStore('s');
  const p=new Promise(r=>{o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)});
  return{get:k=>p.then(d=>d?new Promise(r=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}):null),
         set:(k,v)=>p.then(d=>d&&d.transaction('s','readwrite').objectStore('s').put(v,k))};
}catch{return{get:async()=>null,set:async()=>0}}})();
async function getKey(){let k=ls('gkey','');if(!k){try{k=(await idb.get('gkey'))||''}catch{}if(k)st('gkey',k)}return k}

const S={lang:ls('lang','en'),words:{en:null,de:null},cur:null,filter:'all',answered:false,waiting:false,xr:[],wq:'',
  set:Object.assign({theme:'dark',font:1,srs:true,blur:true,test:false,gem:false},ls('set',{})),dict:'',trc:{}};
const W=()=>S.words[S.lang]||[];
const grup=p=>p<BILMIREM_ESK?'Bilmirem':p<ORTA_UST?'Orta':'Yaxsi';
const GAD={Bilmirem:'Bilmirem',Orta:'Orta',Yaxsi:'İyi bildiğim'};

/* ── almanca yardımcılar ── */
const ART=['der','die','das'], ALL_ART=new Set(['der','die','das','ein','eine','einen','einem','einer','eines','dem','den','des','sich']);
function temel(k){
  if(S.lang!=='de')return k;
  let s=(k||'').replace(/\(.*?\)/g,' ').split(/[,;]/)[0].trim().split(/\s+/);
  while(s.length>1&&s[0].toLowerCase().split('/').every(x=>ALL_ART.has(x)))s.shift();
  return s.join(' ');
}
function artikeller(k){
  const p=(k||'').trim().split(/\s+/);
  return p.length<2?[]:p[0].toLowerCase().split('/').filter(x=>ART.includes(x));
}
function kelimeRenk(k){
  if(S.lang==='de'&&!S.waiting){const a=artikeller(k)[0];if(a)return `var(--${a})`}
  return 'var(--tx)';
}

/* ── aralıklı tekrar ── */
const vakti=(w,n=Date.now()/1000)=>w.sonraki_tekrar==null||w.sonraki_tekrar<=n;
function srsAgirlik(w,n){
  if(w.sonraki_tekrar==null)return 1;
  return 1+Math.min(Math.max(0,n-w.sonraki_tekrar)/Math.max((w.aralik||0)*86400,600),4);
}
function srsGuncelle(s,d){
  const n=Date.now()/1000; let a=s.aralik||0, nx;
  if(d>0){a=a<1?1:Math.min(a*SRS.CARPAN,SRS.MAX_GUN);nx=n+a*86400}
  else if(d>-1){a=Math.max(SRS.ORTA_MIN_GUN,a*.5);nx=n+a*86400}
  else{a=0;nx=n+SRS.BILMIYORUM_SN}
  s.aralik=Math.round(a*1000)/1000;s.son_gorulme=n;s.sonraki_tekrar=nx;
}

/* ── kelime seçimi ── */
function havuz(){
  const f=S.filter, test=S.lang==='de'&&S.set.test;
  return W().filter(w=>{
    if(test&&!artikeller(w.kelime).length)return false;
    if(f==='yaz')return !!w.yazilmali;
    if(f.startsWith('g:'))return w.qrup===f.slice(2);
    if(f!=='all')return grup(w.puan||0)===f;
    return true;
  });
}
function carpanlar(){
  const n=W().filter(w=>grup(w.puan||0)==='Bilmirem').length;
  return n<=ESIK_YUKSEK?CARPAN.az:n<=ESIK_ORTA?CARPAN.orta:CARPAN.yuksek;
}
function sec(){
  let p=havuz(); if(!p.length)return null;
  const n=Date.now()/1000;
  if(S.set.srs){
    let due=p.filter(w=>vakti(w,n));
    if(!due.length)due=[...p].sort((a,b)=>(a.sonraki_tekrar||0)-(b.sonraki_tekrar||0)).slice(0,5);
    p=due;
  }
  const aday=p.filter(w=>w.id!==S.cur?.id), pool=aday.length?aday:p, [cb,co,ci]=carpanlar();
  const ag=pool.map(w=>{
    const pu=w.puan||0,g=grup(pu), a=Math.max(1,10-pu)*(g==='Bilmirem'?cb:g==='Orta'?co:ci);
    return S.set.srs?a*srsAgirlik(w,n):a;
  });
  let r=Math.random()*ag.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ag[i];if(r<=0)return pool[i]}
  return pool[0];
}

/* ── ekran ── */
function groups(){return [...new Set(W().map(w=>w.qrup).filter(q=>q&&!['Bilmirem','Orta','Yaxsi','Default'].includes(q)))].sort()}
function buildFilter(){
  const yaz=W().filter(w=>w.yazilmali).length;
  $('#filter').innerHTML=`<option value="all">Tümü</option><option value="Bilmirem">Bilmirem</option><option value="Orta">Orta</option><option value="Yaxsi">İyi bildiğim</option><option value="yaz">✍️ Yazılmalı (${yaz})</option>`+
    groups().map(g=>`<option value="g:${esc(g)}">🗂️ ${esc(g)}</option>`).join('');
  $('#filter').value=S.filter;
  if($('#filter').value!==S.filter){S.filter='all';$('#filter').value='all'}
}
function stats(){
  const c=W(),n=Date.now()/1000,g={Bilmirem:0,Orta:0,Yaxsi:0};
  c.forEach(w=>g[grup(w.puan||0)]++);
  $('#stats').innerHTML=`${LANGS[S.lang].ad} · ${c.length} kelime<br>Bilmirem ${g.Bilmirem} · Orta ${g.Orta} · İyi ${g.Yaxsi}`+(S.set.srs?` · ⏰ vakti gelen ${c.filter(w=>vakti(w,n)).length}`:'');
}
function applySet(){
  document.documentElement.dataset.theme=S.set.theme;
  document.documentElement.style.setProperty('--fs',[16,18,20][S.set.font-1]+'px');
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  st('set',S.set);
}
function show(){
  S.answered=false;
  const w=sec();
  if(!w){
    S.cur=null;
    $('#main').innerHTML=`<div class="card empty">${W().length?'Bu filtrede kelime yok.':'Henüz kelime yok.'}<br><br><div class="row"><button onclick="openAdd()">➕ Kelime ekle</button><button onclick="openXls()">📥 Excel'den yükle</button></div></div>`;
    stats();return;
  }
  S.cur=w;
  const test=S.lang==='de'&&S.set.test&&artikeller(w.kelime).length>0;
  S.waiting=test;
  const g=grup(w.puan||0), gc=g==='Yaxsi'?'var(--gr)':g==='Orta'?'var(--or)':'var(--rd)';
  $('#main').innerHTML=`
  <div class="card">
    <div class="meta"><span>🗂️ ${esc(w.qrup||'Default')}${w.yazilmali?' · ✍️':''}</span><span class="del" onclick="openEdit()" title="Düzenle / sil">✏️</span><span><b style="color:${gc}">●</b> ${w.puan||0} · ${GAD[g]}</span></div>
    <div class="word" id="word" onclick="say();$('#mean').classList.remove('blur')" style="color:${kelimeRenk(w.kelime)}">${test?'❓ '+esc(temel(w.kelime)):esc(w.kelime)}</div>
    <div class="tools">
      <button onclick="say()" aria-label="Dinle">🔊</button>
      <button onclick="openDict()" aria-label="Sözlük">📖</button>
      <button onclick="aiExplain()" aria-label="AI">🤖</button>
      <button onclick="mic()" aria-label="Konuş">🎤</button>
      <button onclick="openGroup()" aria-label="Grup">🗂️</button>
    </div>
    <div class="art ${test?'on':''}" id="art">${ART.map(a=>`<button style="background:var(--${a})" onclick="pickArt('${a}')">${a}</button>`).join('')}</div>
    <div class="verdict" id="verdict"></div>
    <div class="mean ${S.set.blur?'blur':''}" id="mean" onclick="this.classList.remove('blur')">${esc(w.karsiligi)}</div>
    <div class="ex" id="ex"></div><div class="tr" id="tr"></div>
    <div class="spk" id="spk"></div>
  </div>
  <div class="ans">
    <button class="g" onclick="answer(1)">◄ Biliyorum</button>
    <button class="o" onclick="answer(-.5)">▲ Orta</button>
    <button class="r" onclick="answer(-1)">Bilmiyorum ►</button>
  </div>
  <button class="skip" onclick="show()">Geç →</button>`;
  stats();
  S.pendingEx=w.ornek_cumle&&w.ornek_cumle!=='Örnek yok'?w.ornek_cumle:'';
  if(!test)showExample();
  S.dict='';loadDict(w.kelime);
  say(test?temel(w.kelime):w.kelime);
}
function showExample(){
  const c=S.pendingEx; if(!c){$('#ex').textContent='';$('#tr').textContent='';return}
  const known=new Set();
  W().forEach(w=>{known.add((w.kelime||'').toLowerCase());known.add(temel(w.kelime||'').toLowerCase())});
  $('#ex').innerHTML=c.match(/[A-Za-zÄÖÜäöüß']+|[^A-Za-zÄÖÜäöüß']+/g).map(t=>{
    if(!/^[A-Za-zÄÖÜäöüß']/.test(t))return esc(t);
    const k=t.toLowerCase().replace(/^'+|'+$/g,'');
    return known.has(k)?`<span class="k" onclick="wordInfo(this.textContent)">${esc(t)}</span>`:`<span class="c" onclick="wordInfo(this.textContent)">${esc(t)}</span>`;
  }).join('');
  const w0=S.cur;
  const pr=S.lang==='de'
    ? (w0?.cumle_tr?Promise.resolve(w0.cumle_tr):deTr('s',c).then(r=>{
        if(r&&w0){w0.cumle_tr=r;updateDoc(doc(db,LANGS.de.col,w0.id),{cumle_tr:r}).catch(()=>{})}
        return r}))
    : translate(c);
  pr.then(r=>{const el=$('#tr');if(el&&S.pendingEx===c)el.textContent=r||'(çeviri alınamadı)'});
}

/* ── cevap ── */
async function answer(d,delay=450){
  const w=S.cur; if(!w||S.answered)return;
  S.answered=true;
  if(S.waiting)revealArt();
  const np=(w.puan||0)+d;
  let bg=w.bes_gecme||0, bu=!!w.bes_ustunde_mi, yz=!!w.yazilmali;
  if(!bu&&np>=ORTA_UST)bu=true;
  if(bu&&np<ORTA_UST){bg++;bu=false;if(bg>=3)yz=true}
  if(np<=-7)yz=true;
  if(yz&&!w.yazilmali)toast('✍️ Yazılmalı listesine eklendi');
  const upd={puan:np,bes_gecme:bg,bes_ustunde_mi:bu,yazilmali:yz,aralik:w.aralik||0};
  srsGuncelle(upd,d);
  Object.assign(w,upd);
  $('#mean')?.classList.remove('blur');
  updateDoc(doc(db,LANGS[S.lang].col,w.id),upd).catch(e=>toast('Kayıt hatası: '+e.message));
  setTimeout(()=>{if(S.cur===w)show()},delay);
}
function revealArt(){
  S.waiting=false;
  document.querySelectorAll('#art button').forEach(b=>b.disabled=true);
  const w=S.cur;
  $('#word').textContent=w.kelime;$('#word').style.color=kelimeRenk(w.kelime);
  showExample();say(w.kelime);
}
function pickArt(a){
  const w=S.cur; if(!S.waiting||!w||S.answered)return;
  const dogru=artikeller(w.kelime), ok=dogru.includes(a);
  revealArt();
  $('#verdict').innerHTML=ok?'<span style="color:var(--gr)">✓ Doğru!</span>':`<span style="color:var(--rd)">✗ Yanlış — doğrusu: ${dogru.join('/')}</span>`;
  const key=ok?'artikel_dogru':'artikel_yanlis'; w[key]=(w[key]||0)+1;
  updateDoc(doc(db,LANGS[S.lang].col,w.id),{[key]:w[key]}).catch(()=>{});
  answer(ok?1:-1,ok?1200:2500);
}

/* ── ses ── */
function say(t){
  t=t||S.cur?.kelime; if(!t||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang=LANGS[S.lang].tts;u.rate=.9;speechSynthesis.speak(u);
}
function mic(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return toast('Tarayıcı konuşma tanımayı desteklemiyor (Chrome kullan)');
  if(!S.cur)return;
  const r=new R(); r.lang=LANGS[S.lang].tts; r.maxAlternatives=3;
  const n=s=>s.toLowerCase().replace(/[^a-zäöüß]/g,''), hedef=n(temel(S.cur.kelime));
  $('#spk').textContent='🎤 Dinliyorum…';
  r.onresult=e=>{
    const alts=[...e.results[0]].map(a=>a.transcript), ok=alts.some(a=>n(a)===hedef);

/* ── Almanca→Türkçe (Gemini, bağlama göre, önbellekli) ── */
const SYS_TR='Almanca→Türkçe çevirmensin. Sadece istenen çıktıyı yaz, açıklama ekleme. Türkçe yaz (Azerbaycanca DEĞİL).';
const kc=r=>({k:(r.match(/^K:\s*(.+)$/m)||[])[1]?.trim()||r.split('\n')[0].replace(/^K:\s*/,'').trim(),c:(r.match(/^C:\s*(.+)$/m)||[])[1]?.trim()||''});
async function deTr(kind,a,b=''){
  const c=S.trc.g||(S.trc.g=ls('trg',{})), key=kind+'|'+a+'|'+b;
  if(c[key])return c[key];
  const P={
    w:b?`Almanca cümle: "${b}"\nKelime: "${a}"\nBu kelimenin BU cümlede kullanılan anlamının Türkçesi (çekimli veya ayrılabilir önekli ise cümledeki işleviyle). Sadece 1-3 kelime.`
       :`Almanca: "${a}"\nEn yaygın Türkçe karşılığı. Sadece 1-3 kelime.`,
    s:`Almanca cümleyi doğal Türkçeye çevir. Sadece çeviri:\n${a}`,
    ws:`Almanca kelime: "${a}"\nÖrnek cümle: "${b}"\nTam iki satır yaz:\nK: kelimenin bu cümledeki Türkçe anlamı (1-3 kelime; cümlede kelime geçmiyorsa en yaygın anlamı)\nC: cümlenin doğal Türkçe çevirisi`
  }[kind];
  try{
    const r=await gem(P,kind==='w'?80:400,SYS_TR);
    c[key]=r; const ks=Object.keys(c); if(ks.length>1500)delete c[ks[0]];
    st('trg',c); return r;
  }catch(e){toast('Çeviri hatası: '+e.message);return ''}
}

async function translate(text,lang=S.lang){
  const key='tr_'+lang, c=S.trc[key]||(S.trc[key]=ls(key,{}));
  if(c[text])return c[text];
  try{
    const j=await(await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${lang}|az`)).json();
    if(j.responseStatus===200){c[text]=j.responseData.translatedText;st(key,c);return c[text]}
  }catch{}
  return '';
}
const strip=h=>new DOMParser().parseFromString(h||'','text/html').body.textContent.trim();
async function loadDict(k){
  const lang=S.lang,q=temel(k);
  try{
    let html='';
    if(lang==='en'){
      const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q));
      if(r.ok){
        const e=(await r.json())[0];
        if(e.phonetic)html+=`<div style="color:var(--or)">${esc(e.phonetic)}</div>`;
        for(const m of e.meanings.slice(0,4)){
          html+=`<div class="pos">${esc(m.partOfSpeech)}</div>`;
          for(const d of m.definitions.slice(0,3)){
            html+=`<div class="d">— ${esc(d.definition)}</div>`;
            if(d.example)html+=`<div class="e">${esc(d.example)}</div>`;
          }
        }
      }
    }else{
      for(const v of [...new Set([q,q.toLowerCase(),q[0].toUpperCase()+q.slice(1)])]){
        const r=await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(v));
        if(!r.ok)continue;
        for(const g of (await r.json()).de||[]){
          html+=`<div class="pos">${esc(g.partOfSpeech)}</div>`;
          for(const d of g.definitions.slice(0,4)){
            html+=`<div class="d">— ${esc(strip(d.definition))}</div>`;
            const ex=(d.parsedExamples||[])[0];
            if(ex)html+=`<div class="e">${esc(strip(ex.example))}</div>`;
          }
        }
        if(html)break;
      }
    }
    S.dict=html||'<div class="empty">Tanım bulunamadı.</div>';
  }catch{S.dict='<div class="empty">Sözlük yüklenemedi.</div>'}
  const el=$('#dictBody'); if(el&&S.cur?.kelime===k)el.innerHTML=S.dict;
}
async function findArtikel(k){
  const t=temel(k);
  if(!t||/\s/.test(t)||!/^[A-ZÄÖÜ]/.test(t))return null;
  try{
    const j=await(await fetch(`https://en.wiktionary.org/w/api.php?action=parse&page=${encodeURIComponent(t)}&prop=wikitext&format=json&redirects=1&origin=*`)).json();
    const txt=j.parse?.wikitext?.['*']||'', m=txt.match(/==German==([\s\S]*?)(?=\n==[^=]|$)/), n=m&&m[1].match(/\{\{de-noun\|([^}]*)\}\}/);
    if(n){
      const p=n[1].split('|'), g=(p.find(x=>x.startsWith('g='))||p[0]).replace(/^g=/,''), gs=[...new Set(g.match(/[mfn]/g)||[])];
      if(gs.length)return gs.map(x=>({m:'der',f:'die',n:'das'})[x]).join('/');
    }
  }catch{}
  return null;
}

  st('gmodel',$('#gm').value.trim()||'gemini-3.5-flash-lite');
  if(close){closeModal();toast('Kaydedildi')}
}
async function testKey(){
  await saveKey(false);toast('⏳ Test ediliyor…');
  try{await gem('Reply with OK',200);toast('✓ Anahtar çalışıyor')}catch(e){toast('✗ '+e.message)}
}
async function gem(prompt,max,sys){
  const key=await getKey();
  if(!key)throw new Error('Önce ⚙️ Ayarlar → 🔑 bölümüne Gemini anahtarını gir.');
  const m=ls('gmodel',''), model=(!m||m==='gemini-2.5-flash-lite')?'gemini-3.5-flash-lite':m;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({systemInstruction:{parts:[{text:sys||'Sen bir dil öğretmenisin. Cevabın TAMAMI Türkçe olmalı (sadece Almanca/İngilizce kelime ve örnekler orijinal dilde kalır). Never answer in English. Düz metin yaz, markdown kullanma.'}]},contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0,maxOutputTokens:max}})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error?.message||r.status);
  const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
  if(!t)throw new Error('Boş cevap');
  try{
    const u=ls('gusage',{}), x=u.d===today()?u:{d:today(),req:0,tok:0};
    x.req++; x.tok+=j.usageMetadata?.totalTokenCount||0; st('gusage',x);
    if(!sys)toast(`🤖 ${j.usageMetadata?.totalTokenCount||'?'} token · bugün ${x.req} istek`);
  }catch{}
  return t;
}

/* ── cümledeki kelimeye dokununca: ÖNCE ücretsiz çeviri, AI sadece butonla ── */
async function wordInfo(t){
  S.wq=t.replace(/^'+|'+$/g,'');
  modal(`<h3>${esc(S.wq)}<button onclick="closeModal()">✕</button></h3>
    <div id="wiB" style="font-size:1.3rem;margin:.6rem 0 1rem">⏳</div>
    <div class="row"><button onclick="say(S.wq)">🔊</button><button onclick="wordAI(S.wq)">🤖 AI açıkla</button><button onclick="openAdd(S.wq)">➕ Ekle</button></div>`);
  say(S.wq);
  const r=S.lang==='de'?await deTr('w',S.wq,S.pendingEx||''):await translate(S.wq.toLowerCase());
  const el=$('#wiB'); if(el)el.textContent=r||'Çeviri alınamadı';
}
async function wordAI(t){
  const sent=S.pendingEx||'', key=`${S.lang}|${t.toLowerCase()}|${sent}`, c=ls('wai2',{}), body=()=>$('#waBody');
  S.wq=t;
  modal(`<h3>🤖 ${esc(t)}<button onclick="closeModal()">✕</button></h3>
    <div id="waBody" style="line-height:1.7;white-space:pre-wrap">⏳</div>
    <button onclick="openAdd(S.wq)" style="width:100%;margin-top:.8rem">➕ Veritabanına ekle</button>`);
  if(c[key]){body().textContent=c[key];return}
  const de=S.lang==='de', L=de?'German':'English';
  const prompt=`${L} sentence: "${sent}"
Explain the word "${t}" in Turkish, plain text, max 45 words: its Turkish meaning in THIS sentence; if it is an inflected form, give the base form (infinitive/singular) and why it changed (person, tense, case, plural, Partizip...)${de?'; if a noun, give article + plural':''}. Write in TURKISH.`;
  try{
    const r=await gem(prompt,400);
    c[key]=r; const ks=Object.keys(c); if(ks.length>300)delete c[ks[0]];
    st('wai2',c); if(body())body().textContent=r;
  }catch(e){if(body())body().textContent='Hata: '+e.message}
}

/* ── kelime kartı için AI açıklama ── */
function renderAI(t){
  const w=S.cur, el=$('#aiBody'); if(!el||!w)return;
  const m=t.match(/^Düzeltme:\s*(.+)$/m);
  S.fix=m?m[1].trim().replace(/[.。]+$/,''):'';
  if(!m||!S.fix||S.fix.toLowerCase()===(w.karsiligi||'').toLowerCase()){el.textContent=t;return}
  el.innerHTML=esc(t).replace(esc(m[0]),`Düzeltme: <span class="c" style="color:var(--der);text-decoration:underline dotted;cursor:pointer" onclick="fixTr()">${esc(S.fix)}</span>`);
}
async function fixTr(){
  const w=S.cur; if(!w||!S.fix)return;
  if(!confirm(`Çeviri değiştirilsin mi?\n\n${w.karsiligi}  →  ${S.fix}`))return;
  w.karsiligi=S.fix;
  const m=$('#mean'); if(m)m.textContent=w.karsiligi;
  try{await updateDoc(doc(db,LANGS[S.lang].col,w.id),{karsiligi:w.karsiligi});toast('Çeviri güncellendi')}catch(e){toast('Hata: '+e.message)}
  renderAI(w.ai3||'');
}
async function aiExplain(force){
  const w=S.cur; if(!w)return;
  modal(`<h3>🤖 ${esc(w.kelime)}<button onclick="closeModal()">✕</button></h3>
    <div id="aiBody" style="line-height:1.7;white-space:pre-wrap">⏳</div>
    <button onclick="aiExplain(true)" style="width:100%;margin-top:.8rem">🔄 Yenile</button>`);
  if(w.ai3&&force!==true){renderAI(w.ai3);return}
  const ex=w.ornek_cumle&&w.ornek_cumle!=='Örnek yok'?w.ornek_cumle:'', de=S.lang==='de', L=de?'German':'English';
  const prompt=`${L} vocabulary card. Entry: "${w.kelime}" (given TR: ${w.karsiligi}).${ex?` Example sentence: "${ex}".`:''}
Answer in Turkish, plain text, no markdown, max 80 words. Use only these lines, skip the ones that don't apply:
Kök: ONLY if the entry is an inflected form (conjugated verb, plural, case, comparative, participle) or its spelling differs from the dictionary form: write the base form (${de?'infinitive / nominative singular':'infinitive / singular'}) and explain WHY it looks like this (person, tense, case, plural, stem-vowel change such as a→ä, etc.)
Düzeltme: ONLY if the given TR is wrong for this entry: the correct Turkish translation in 1-3 words, nothing else (no explanation on this line).
Anlam: real meaning(s) of the base word${ex?', and which one is used in the sentence':''}.
Kullanım: ${ex?'tense/structure in the sentence (Präsens, Perfekt, Präteritum, Futur, Passiv, Konjunktiv, Imperativ, separable prefix, etc.)':'-'}
Mastar: infinitive (verbs only)
${de?'Perfekt: haben/sein + Partizip II (verbs only)\nArtikel: der/die/das + plural (nouns only)':''}
Write every line in TURKISH.`;
  try{
    const t=await gem(prompt,800);
    w.ai3=t; renderAI(t);
    updateDoc(doc(db,LANGS[S.lang].col,w.id),{ai3:t}).catch(()=>{});
  }catch(e){const b=$('#aiBody');if(b)b.textContent='Hata: '+e.message}
}

/* ── dil / filtre / yükleme ── */
function setFilter(v){S.filter=v;show()}
async function setLang(l){
  S.lang=l;st('lang',l);S.filter='all';S.cur=null;S.waiting=false;
  if(l!=='de')S.set.test=false;
  applySet();
  await load(l);
}
async function load(l){
  if(!S.words[l]){
    $('#stats').textContent=`${LANGS[l].ad} kelimeleri yükleniyor…`;
    $('#main').innerHTML='<div class="card empty">Yükleniyor…</div>';
    try{
      S.words[l]=(await getDocs(collection(db,LANGS[l].col))).docs.map(d=>({id:d.id,...d.data()}));
    }catch(e){$('#stats').textContent='Firebase hatası: '+e.message;return}
  }
  if(S.lang!==l)return;
  buildFilter();show();
}

/* ── 🎧 Yolda dinle ──
   K: uzun sessiz ses döngüsü → Chrome/Android bunu "müzik" sayar, bildirimde kontroller çıkar, ekran kapanınca sayfa uyumaz.
   V: kelime ve anlam sesleri (Google ses servisi; olmazsa tarayıcı sesi). Kelime → 2 sn → anlam → 2 sn → sonraki. ── */
const L={k:new Audio(),v:new Audio(),on:false,paused:false,list:[],i:0,seg:0,txt:[],t:null,g:null,sil:null};
/* Gemini ses üretimi: her kelime/anlam bir kez üretilir, cihazda saklanır (sonra internetsiz de çalar) */
const TTS_MODEL='gemini-3.1-flash-tts-preview', ttsMem=new Map();
function wavBlob(pcm,rate=24000){
  const n=pcm.byteLength,b=new DataView(new ArrayBuffer(44+n)),w=(o,t)=>[...t].forEach((c,k)=>b.setUint8(o+k,c.charCodeAt(0)));
  w(0,'RIFF');b.setUint32(4,36+n,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
  b.setUint32(24,rate,true);b.setUint32(28,rate*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n,true);
  new Uint8Array(b.buffer,44).set(new Uint8Array(pcm));
  return new Blob([b],{type:'audio/wav'});
}
function ttsGet(text,lang,cacheOnly){
  const key='tts|'+lang+'|'+text;
  if(!ttsMem.has(key))ttsMem.set(key,(async()=>{
    let buf=null;try{buf=await idb.get(key)}catch{}
    if(!buf){
      if(cacheOnly)throw new Error('kayıtlı ses yok');const k=await getKey(); if(!k)throw new Error('Gemini anahtarı yok (⚙️→🔑)');
      const who={de:'German',en:'English',tr:'Turkish'}[lang];
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent`,{method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':k},
        body:JSON.stringify({contents:[{parts:[{text:`Say slowly and clearly in ${who}: ${text}`}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Kore'}}}}})});
      const j=await r.json(); if(!r.ok)throw new Error(j.error?.message||r.status);
      const b64=j.candidates?.[0]?.content?.parts?.find(x=>x.inlineData)?.inlineData?.data; if(!b64)throw new Error('ses dönmedi');
      const bin=atob(b64),u8=new Uint8Array(bin.length);for(let q=0;q<bin.length;q++)u8[q]=bin.charCodeAt(q);
      buf=u8.buffer;try{await idb.set(key,buf)}catch{}
    }
    return URL.createObjectURL(wavBlob(buf));
  })().catch(e=>{ttsMem.delete(key);throw e}));
  return ttsMem.get(key);
}
const plTexts=w=>[(w.kelime||'').replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim(),(w.karsiligi||'').replace(/[\/]/g,', ')];
async function plPrefetch(){ /* sıradaki kelimelerin sesini önceden hazırla */
  if(L.pf||!S.set.gem||L.noG)return;L.pf=true;
  try{for(let d=1;d<=4&&L.on;d++){const w=L.list[(L.i+d)%L.list.length],[a,b]=plTexts(w);await ttsGet(a,S.lang);await ttsGet(b,'tr')}}catch{}
  L.pf=false;
}
function silence(sec){
  const sr=8000,n=sr*sec,b=new DataView(new ArrayBuffer(44+n)),w=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');b.setUint32(4,36+n,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
  b.setUint32(24,sr,true);b.setUint32(28,sr,true);b.setUint16(32,1,true);b.setUint16(34,8,true);w(36,'data');b.setUint32(40,n,true);
  for(let i=0;i<n;i++)b.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function plState(p){try{navigator.mediaSession.playbackState=p?'playing':'paused'}catch{}const b=$('#plP');if(b)b.textContent=p?'⏸':'▶'}
function startListen(){
  const p=havuz(); if(!p.length)return toast('Bu filtrede kelime yok');
  closeModal(); stopListen();
  L.list=[...p].sort(()=>Math.random()-.5); L.i=0; L.on=true; L.paused=false; L.noG=false; L.sil=L.sil||silence(12);
  L.k.src=L.sil; L.k.loop=true; L.k.play().catch(()=>toast('Ses başlatılamadı, tekrar dene'));
  L.v.src=L.sil; L.v.play().then(()=>L.v.pause()).catch(()=>{}); /* iOS için ses kanalını bu dokunuşta aç */
  if(!$('#pl')){document.body.insertAdjacentHTML('beforeend',`<div id="pl"><div class="t"><b id="plW"></b><span id="plM"></span><span id="plD" style="display:block;color:var(--or);font-size:.7rem"></span></div>
    <button onclick="plPrev()">⏮</button><button id="plP" onclick="plToggle()">⏸</button><button onclick="plNext()">⏭</button><button onclick="stopListen()">✕</button></div>`)}
  document.body.style.paddingBottom='5rem';
  try{const ms=navigator.mediaSession;[['play',()=>plToggle(true)],['pause',()=>plToggle(false)],['nexttrack',plNext],['previoustrack',plPrev],['stop',stopListen]].forEach(([k,f])=>{try{ms.setActionHandler(k,f)}catch{}})}catch{}
  plLoad();
}
function plLoad(){
  if(!L.on)return;
  const w=L.list[L.i%L.list.length], wt=(w.kelime||'').replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim(), mt=(w.karsiligi||'').replace(/[\/]/g,', ');
  L.txt=[wt,mt]; L.seg=0; plPrefetch();
  $('#plW').textContent=w.kelime; $('#plM').textContent=w.karsiligi;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:w.kelime,artist:w.karsiligi,album:'Yolda dinle · '+LANGS[S.lang].ad})}catch{}
  plState(true); plSpeak();
}
const dbg=t=>{const e=$('#plD');if(e)e.textContent=t};
function plSpeak(){
  if(!L.on||L.paused)return;
  clearTimeout(L.t);clearTimeout(L.g);speechSynthesis?.cancel();
  const t=L.txt[L.seg], lang=L.seg?'tr':S.lang, v=L.v, q=encodeURIComponent(t.slice(0,180)); let done=false;
  const next=()=>{if(done)return;done=true;clearTimeout(L.g);L.t=setTimeout(()=>{if(!L.on||L.paused)return;L.seg++;if(L.seg>=2){L.i++;plLoad()}else plSpeak()},2000)};
  /* 3) son çare: tarayıcı sesi (cancel'dan hemen sonra speak() sessiz kalıyordu → 300 ms bekle, nesneyi sakla) */
  const speech=()=>{
    if(done)return;clearTimeout(L.g);
    if(!window.speechSynthesis){dbg('⚠️ Bu tarayıcıda ses yok');return next()}
    const tl=L.seg?'tr-TR':LANGS[S.lang].tts; let started=false;
    const go=n=>{ /* ana 🔊 butonu gibi: ses (voice) seçmeden, sadece dil ver. Hata olursa bir kez daha dene */
      const u=new SpeechSynthesisUtterance(t); L.u=u; u.lang=tl; if(n===0)u.rate=.9;
      u.onstart=()=>{started=true;dbg('🔊 tarayıcı sesi')};
      u.onend=next;
      u.onerror=e=>{
        if(e.error==='canceled'||e.error==='interrupted')return;
        if(n<2){dbg('↻ ses hatası ('+e.error+'), tekrar deniyorum…');speechSynthesis.cancel();setTimeout(()=>{if(!done)go(n+1)},500)}
        else{dbg('⚠️ Telefon sesi okuyamadı ('+e.error+'). Ayarlar → Metin okuma → '+(L.seg?'Türkçe':LANGS[S.lang].ad)+' ses paketini indir');next()}
      };
      speechSynthesis.cancel();
      setTimeout(()=>{if(done)return;speechSynthesis.resume();speechSynthesis.speak(u)},300);
    };
    go(0);
    L.g=setTimeout(()=>{if(!started){dbg('⚠️ Ses başlamadı (telefon ses motoru yanıt vermiyor)');next()}},9000);
  };
  /* 2) Google ses adresleri */
  const urls=[`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${lang}&q=${q}`,`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang}&q=${q}`];
  const tryAudio=i=>{
    if(done)return; if(i>=urls.length)return speech();
    let used=false; const fail=()=>{if(used)return;used=true;tryAudio(i+1)};
    v.onerror=fail; v.onended=next; v.onplaying=()=>dbg('🔊 Google sesi');
    v.src=urls[i]; v.play().catch(fail);
  };
  /* 1) Gemini (açıksa) ya da daha önce kaydedilmiş ses */
  dbg('⏳ ses hazırlanıyor…');
  ttsGet(t,lang,!S.set.gem||L.noG).then(u=>{
    if(done||!L.on)return;
    v.onended=next; v.onplaying=()=>dbg('🔊 kayıtlı/Gemini sesi'); v.onerror=()=>tryAudio(0);
    v.src=u; v.play().catch(()=>tryAudio(0));
  }).catch(e=>{
    if(S.set.gem&&!L.noG&&/quota|429|exhaust|limit/i.test(e.message)){L.noG=true;toast('Gemini limiti doldu, ücretsiz sese geçildi')}
    tryAudio(0);
  });
  L.g=setTimeout(()=>{if(!done)speech()},20000);
}
function plToggle(play){
  if(!L.on)return;
  if(play===undefined)play=L.paused;
  L.paused=!play;
  if(play){L.k.play().catch(()=>{});plState(true);plSpeak()}
  else{clearTimeout(L.t);clearTimeout(L.g);L.v.pause();L.k.pause();speechSynthesis?.cancel();plState(false)}
}
function plNext(){if(!L.on)return;L.i++;if(L.paused)L.paused=false,L.k.play().catch(()=>{});plLoad()}
function plPrev(){if(!L.on)return;L.i=Math.max(0,L.i-1);if(L.paused)L.paused=false,L.k.play().catch(()=>{});plLoad()}
function stopListen(){
  L.on=false;clearTimeout(L.t);clearTimeout(L.g);
  for(const a of [L.k,L.v]){a.onended=a.onerror=null;a.pause();a.removeAttribute('src')}
  try{speechSynthesis?.cancel();navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none'}catch{}
  $('#pl')?.remove();document.body.style.paddingBottom='';
}

/* ── klavye ── */
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||$('#modal').classList.contains('on'))return;
  const k=e.key;
  if(k==='ArrowLeft')answer(1);else if(k==='ArrowRight')answer(-1);else if(k==='ArrowUp'){e.preventDefault();answer(-.5)}
  else if(k==='ArrowDown'){e.preventDefault();say()}
  else if(k==='1')pickArt('der');else if(k==='2')pickArt('die');else if(k==='3')pickArt('das');
  else if(k==='m'||k==='M')openGroup();
});

Object.assign(window,{startListen,stopListen,plToggle,plNext,plPrev,S,$,setLang,setFilter,show,say,mic,answer,pickArt,openDict,openSettings,setOpt,openAdd,autoFill,addTr,addEx,addSave,openEdit,saveEdit,openXls,xlsPick,xlsGo,
  openGroup,saveGroup,openYaz,copyYaz,unYaz,clipTr,closeModal,delWord,aiExplain,wordInfo,wordAI,fixTr,openKey,saveKey,testKey,editTr,
  unlock(){if($('#pw').value===PASS){st('auth',PASS);$('#lock').style.display='none';start()}else{$('#pwe').textContent='Şifre yanlış';$('#pw').value=''}}});

function start(){applySet();try{navigator.storage?.persist?.()}catch{}load(S.lang)}
if(ls('auth')===PASS)start();else{$('#lock').style.display='flex'}
</script>
