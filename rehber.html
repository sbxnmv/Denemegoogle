<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Söz Öyrən</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
:root{--bg:#0f0f0f;--card:#181818;--border:#2a2a2a;--text:#f0ede6;--muted:#666;--green:#3ddc84;--red:#ff4d4d;--orange:#ffaa00;--blue:#4da6ff;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

#lockScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
#lockScreen h2{font-family:'Fraunces',serif;font-size:24px}
#lockScreen input{background:#1a1a1a;border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:18px;letter-spacing:4px;text-align:center;width:160px;outline:none}
#lockScreen button{background:var(--green);color:#000;border:none;padding:10px 28px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
#lockScreen .err{color:var(--red);font-size:13px;height:16px}

header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:99px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.filter-btn.active{border-color:var(--text);color:var(--text);background:#222}

/* Qrup dropdown */
.grup-dropdown-wrap{position:relative}
.grup-dropdown-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:99px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px}
.grup-dropdown-btn.active{border-color:var(--blue);color:var(--blue);background:rgba(77,166,255,0.08)}
.grup-dropdown-list{position:absolute;top:calc(100% + 6px);right:0;background:#1e1e1e;border:1px solid var(--border);border-radius:10px;min-width:160px;z-index:50;overflow:hidden;display:none}
.grup-dropdown-list.open{display:block}
.grup-dropdown-item{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--muted)}
.grup-dropdown-item:hover{background:#2a2a2a;color:var(--text)}
.grup-dropdown-item.active{color:var(--blue)}

.stats-bar{font-size:11px;color:var(--muted);font-family:monospace;white-space:nowrap}

.main{flex:1;display:grid;grid-template-columns:1fr 340px;gap:0;overflow:hidden}
.left{padding:3rem 2.5rem;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow-y:auto}
.word-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2rem;min-height:300px}
.word-display{font-family:'Fraunces',serif;font-size:52px;font-weight:600;letter-spacing:-1px;line-height:1;cursor:pointer;transition:color 0.2s}
.word-display:hover{color:var(--blue)}
.meaning{font-size:17px;color:#aaa;max-width:420px;line-height:1.5}
.example{font-size:14px;color:var(--muted);font-style:italic;max-width:440px;line-height:1.7;border-left:2px solid var(--border);padding-left:14px;text-align:left}
.example-tr{font-size:12px;color:#555;font-style:normal;margin-top:4px}
.score-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:monospace;padding:4px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.word-actions{display:flex;align-items:center;gap:10px}
.sound-btn{background:none;border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.dict-btn{background:none;border:1px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:none;align-items:center;justify-content:center}

.qrup-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.qrup-select{background:#1a1a1a;border:1px solid var(--border);color:var(--muted);padding:5px 10px;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;outline:none}
.qrup-save-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.qrup-save-btn:hover{color:var(--text);border-color:#555}

.btns{display:flex;gap:12px;margin-top:1rem}
.btn{padding:12px 28px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.btn:hover{transform:translateY(-1px);opacity:0.9}
.btn:active{transform:scale(0.97)}
.btn-green{background:var(--green);color:#000}
.btn-orange{background:var(--orange);color:#000}
.btn-red{background:var(--red);color:#fff}
.next-btn{background:var(--border);color:var(--muted);padding:8px 20px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:0.5rem}
.next-btn:hover{background:#333;color:var(--text)}

.right{background:var(--card);overflow-y:auto;display:flex;flex-direction:column}
.dict-header{padding:1rem 1.2rem;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);font-family:monospace}
.dict-content{padding:1.2rem;flex:1;font-size:13px;line-height:1.8;color:#ccc}
.dict-content .pos{font-size:11px;color:var(--blue);font-family:monospace;text-transform:uppercase;letter-spacing:1px;margin:1rem 0 4px}
.dict-content .def{color:#ddd;margin-bottom:4px}
.dict-content .ex{color:var(--muted);font-style:italic;font-size:12px;padding-left:10px;border-left:1px solid var(--border)}
.dict-content .phonetic{color:var(--orange);font-size:12px;font-family:monospace;margin-bottom:8px}
.empty-state{color:var(--muted);font-size:13px;padding:2rem;text-align:center}
.loading{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}

/* Mobil dict modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal-box{background:#1a1a1a;border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:75vh;overflow-y:auto;padding:1.2rem}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13px;pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:99}
.toast.show{opacity:1}

@media(max-width:700px){
  .main{grid-template-columns:1fr}
  .right{display:none}
  .left{padding:2rem 1.2rem}
  .word-display{font-size:38px}
  .dict-btn{display:flex}
}
</style>
</head>
<body>

<div id="lockScreen">
  <h2>🔒 söz öyrən</h2>
  <input type="password" id="passInput" placeholder="······" maxlength="10" onkeydown="if(event.key==='Enter')checkPass()">
  <button onclick="checkPass()">Daxil ol</button>
  <div class="err" id="passErr"></div>
</div>

<header>
  <div class="logo">söz öyrən</div>
  <div class="header-right">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Hamısı</button>
      <button class="filter-btn" onclick="setFilter('Bilmirem',this)">Bilmirəm</button>
      <button class="filter-btn" onclick="setFilter('Orta',this)">Orta</button>
      <button class="filter-btn" onclick="setFilter('Yaxsi',this)">Yaxşı bilirəm</button>
      <div class="grup-dropdown-wrap">
        <button class="grup-dropdown-btn" id="grupDropBtn" onclick="toggleGrupDrop()">Qruplar ▾</button>
        <div class="grup-dropdown-list" id="grupDropList"></div>
      </div>
    </div>
  </div>
  <div class="stats-bar" id="statsBar">yüklənir...</div>
</header>

<div class="main">
  <div class="left">
    <div class="word-section" id="wordSection">
      <div class="empty-state loading">Firebase-dən yüklənir...</div>
    </div>
  </div>
  <div class="right">
    <div class="dict-header">📖 free dictionary api</div>
    <div class="dict-content" id="dictContent"><div class="empty-state">Söz seçin</div></div>
  </div>
</div>

<!-- Mobil dict modal -->
<div class="modal-overlay" id="dictModal" onclick="closeDictModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDictModal()">✕</button>
    <div style="font-size:12px;color:var(--muted);font-family:monospace;margin-bottom:12px">📖 free dictionary api</div>
    <div id="dictModalContent"><div class="empty-state">Yüklənir...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const PASS = '654881';
const SKIP_GROUPS = new Set(['Bilmirem','Orta','Yaxsi','Default','']);

window.checkPass = function() {
  const val = document.getElementById('passInput').value;
  if (val === PASS) {
    localStorage.setItem('soz_auth', PASS);
    document.getElementById('lockScreen').style.display = 'none';
    init();
  } else {
    document.getElementById('passErr').textContent = 'Şifrə səhvdir';
    document.getElementById('passInput').value = '';
  }
};

const app = initializeApp({
  apiKey: "AIzaSyCo8L-ziEftkkDz8tDm0X0nKdUME4bKQNM",
  authDomain: "sozler-fc7c0.firebaseapp.com",
  projectId: "sozler-fc7c0",
  storageBucket: "sozler-fc7c0.firebasestorage.app",
  messagingSenderId: "234991221431",
  appId: "1:234991221431:web:da04cfca423a00704cab32"
});
const db = getFirestore(app);

let allWords = [], filteredWords = [], currentWord = null;
let currentFilter = 'all', currentGrup = null;
let sessionCount = 0;
let allGroups = [];
const trCache = {};

const ORTA_UST = 5, BILMIREM = 2;
function paunGrup(p){ return p < BILMIREM ? 'Bilmirem' : p < ORTA_UST ? 'Orta' : 'Yaxsi' }

async function init() {
  const snap = await getDocs(collection(db, 'sozler'));
  allWords = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  const grupSet = new Set();
  allWords.forEach(w => { if (w.qrup && !SKIP_GROUPS.has(w.qrup)) grupSet.add(w.qrup); });
  allGroups = [...grupSet].sort();

  buildGrupDropdown();
  applyFilter();
  showStats();
}

function buildGrupDropdown() {
  const list = document.getElementById('grupDropList');
  list.innerHTML = `<div class="grup-dropdown-item ${!currentGrup?'active':''}" onclick="selectGrup(null)">Hamısı</div>`;
  allGroups.forEach(g => {
    list.innerHTML += `<div class="grup-dropdown-item ${currentGrup===g?'active':''}" onclick="selectGrup('${escHtml(g)}')">${escHtml(g)}</div>`;
  });
}

window.toggleGrupDrop = function() {
  document.getElementById('grupDropList').classList.toggle('open');
};
document.addEventListener('click', e => {
  if (!e.target.closest('.grup-dropdown-wrap')) {
    document.getElementById('grupDropList').classList.remove('open');
  }
});

window.selectGrup = function(g) {
  currentGrup = g;
  currentFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active'); // "Hamısı"
  const btn = document.getElementById('grupDropBtn');
  btn.textContent = g ? g + ' ▾' : 'Qruplar ▾';
  btn.classList.toggle('active', !!g);
  document.getElementById('grupDropList').classList.remove('open');
  buildGrupDropdown();
  applyFilter();
};

function applyFilter() {
  let pool = [...allWords];
  if (currentGrup) pool = pool.filter(w => w.qrup === currentGrup);
  if (currentFilter !== 'all') pool = pool.filter(w => paunGrup(w.puan || 0) === currentFilter);
  filteredWords = pool;
  showNewWord();
}

function showStats() {
  const total = allWords.length;
  const yaxsi = allWords.filter(w => paunGrup(w.puan||0) === 'Yaxsi').length;
  const orta  = allWords.filter(w => paunGrup(w.puan||0) === 'Orta').length;
  const bilmi = allWords.filter(w => paunGrup(w.puan||0) === 'Bilmirem').length;
  document.getElementById('statsBar').textContent =
    `keçildi: ${sessionCount} · cəmi ${total} · bilmirəm ${bilmi} · orta ${orta} · yaxşı ${yaxsi}`;
}

function getWeightedWord() {
  if (!filteredWords.length) return null;
  const weights = filteredWords.map(w => Math.max(1, 10 - (w.puan || 0)));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for (let i = 0; i < filteredWords.length; i++) { r -= weights[i]; if (r <= 0) return filteredWords[i]; }
  return filteredWords[0];
}

function prefetchNext() {
  const seen = new Set([currentWord?.id]);
  for (let i = 0; i < 3; i++) {
    const candidates = filteredWords.filter(w => !seen.has(w.id));
    if (!candidates.length) break;
    const w = candidates[Math.floor(Math.random() * candidates.length)];
    seen.add(w.id);
    if (w.ornek_cumle && !trCache[w.ornek_cumle]) {
      fetchTr(w.ornek_cumle).then(tr => { if(tr) trCache[w.ornek_cumle] = tr; });
    }
  }
}

async function fetchTr(text) {
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|az`);
    const data = await res.json();
    if (data.responseStatus === 200) return data.responseData.translatedText;
  } catch(e) {}
  return null;
}

function showNewWord() {
  const w = getWeightedWord();
  if (!w) { document.getElementById('wordSection').innerHTML = '<div class="empty-state">Bu filtrdə söz yoxdur</div>'; return; }
  currentWord = w;
  const grup = paunGrup(w.puan || 0);
  const gc = grup==='Yaxsi'?'var(--green)':grup==='Orta'?'var(--orange)':'var(--red)';

  const grupOpts = allGroups.map(g =>
    `<option value="${escHtml(g)}" ${w.qrup===g?'selected':''}>${escHtml(g)}</option>`
  ).join('');

  document.getElementById('wordSection').innerHTML = `
    <div class="word-actions">
      <div class="word-display" onclick="speak('${escHtml(w.kelime)}')">${escHtml(w.kelime)}</div>
      <button class="sound-btn" onclick="speak('${escHtml(w.kelime)}')">🔊</button>
      <button class="dict-btn" onclick="openDictModal()" title="Lüğət">📖</button>
    </div>
    <div class="meaning">${escHtml(w.karsiligi)}</div>
    ${w.ornek_cumle ? `<div class="example">${escHtml(w.ornek_cumle)}<div class="example-tr" id="exTr">${trCache[w.ornek_cumle]||'tərcümə edilir...'}</div></div>` : ''}
    <div class="score-badge"><span style="color:${gc}">●</span> skor: ${w.puan||0} · ${grup==='Yaxsi'?'yaxşı bilirəm':grup==='Orta'?'orta':'bilmirəm'}</div>
    <div class="qrup-row">
      <select class="qrup-select" id="qrupSelect">
        <option value="">— qrup seç —</option>${grupOpts}
      </select>
      <button class="qrup-save-btn" onclick="saveQrup()">Saxla</button>
    </div>
    <div class="btns">
      <button class="btn btn-green" onclick="answer(1)">◄ Bilirəm</button>
      <button class="btn btn-orange" onclick="answer(-0.5)">Orta</button>
      <button class="btn btn-red" onclick="answer(-1)">Bilmirəm ►</button>
    </div>
    <button class="next-btn" onclick="nextWord()">Keç →</button>
  `;

  if (w.ornek_cumle && !trCache[w.ornek_cumle]) {
    fetchTr(w.ornek_cumle).then(tr => {
      trCache[w.ornek_cumle] = tr || '';
      const el = document.getElementById('exTr');
      if (el) el.textContent = tr || '';
    });
  }

  loadDict(w.kelime);
  speak(w.kelime);
  prefetchNext();
}

window.nextWord = function() { sessionCount++; showStats(); showNewWord(); };

window.saveQrup = async function() {
  const sel = document.getElementById('qrupSelect');
  const qrup = sel?.value;
  if (!qrup || !currentWord) return;
  try {
    await updateDoc(doc(db, 'sozler', currentWord.id), { qrup });
    currentWord.qrup = qrup;
    const idx = allWords.findIndex(w => w.id === currentWord.id);
    if (idx >= 0) allWords[idx].qrup = qrup;
    showToast(currentWord.kelime + ' → ' + qrup);
  } catch(e) { showToast('Xəta: ' + e.message); }
};

async function answer(delta) {
  if (!currentWord) return;
  const oldPuan = currentWord.puan || 0;
  const newPuan = oldPuan + delta;
  const oldGrup = paunGrup(oldPuan);
  const newGrup = paunGrup(newPuan);
  let {bes_gecme=0, bes_ustunde_mi=false, yazilmali=false} = currentWord;

  if (!bes_ustunde_mi && newPuan >= ORTA_UST) bes_ustunde_mi = true;
  if (bes_ustunde_mi && newPuan < ORTA_UST) {
    bes_gecme++; bes_ustunde_mi = false;
    if (bes_gecme >= 3) { yazilmali = true; showToast('✍️ ' + currentWord.kelime + ' — yazılmalı siyahısına əlavə edildi'); }
  }

  Object.assign(currentWord, {puan:newPuan, bes_gecme, bes_ustunde_mi, yazilmali});
  const idx = allWords.findIndex(w => w.id === currentWord.id);
  if (idx >= 0) Object.assign(allWords[idx], currentWord);

  try { await updateDoc(doc(db,'sozler',currentWord.id), {puan:newPuan, bes_gecme, bes_ustunde_mi, yazilmali}); }
  catch(e) { console.error(e); }

  if (oldGrup !== newGrup) showToast(currentWord.kelime + ' → ' + newGrup);
  sessionCount++; showStats();
  setTimeout(showNewWord, 300);
}

let lastDictHtml = '';
async function loadDict(kelime) {
  const el = document.getElementById('dictContent');
  if (el) el.innerHTML = '<div class="empty-state loading">axtarılır...</div>';
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(kelime)}`);
    if (!res.ok) { lastDictHtml = '<div class="empty-state">Tapılmadı</div>'; }
    else {
      const data = await res.json();
      const entry = data[0]; let html = '';
      if (entry.phonetic) html += `<div class="phonetic">${entry.phonetic}</div>`;
      for (const m of entry.meanings.slice(0,4)) {
        html += `<div class="pos">${m.partOfSpeech}</div>`;
        for (const d of m.definitions.slice(0,3)) {
          html += `<div class="def">— ${escHtml(d.definition)}</div>`;
          if (d.example) html += `<div class="ex">"${escHtml(d.example)}"</div>`;
        }
      }
      lastDictHtml = html;
    }
  } catch(e) { lastDictHtml = '<div class="empty-state">API xətası</div>'; }
  if (el) el.innerHTML = lastDictHtml;
}

window.openDictModal = function() {
  document.getElementById('dictModalContent').innerHTML = lastDictHtml || '<div class="empty-state">Yüklənir...</div>';
  document.getElementById('dictModal').classList.add('open');
};
window.closeDictModal = function(e) {
  if (!e || e.target === document.getElementById('dictModal')) {
    document.getElementById('dictModal').classList.remove('open');
  }
};

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

window.setFilter = function(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
};
window.answer = answer;
window.showNewWord = showNewWord;
window.speak = speak;

if (localStorage.getItem('soz_auth') === PASS) {
  document.getElementById('lockScreen').style.display = 'none';
  init();
}
</script>
</body>
</html>
